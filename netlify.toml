# Two Netlify sites build from this one repository:
#
#   production site -> main         -> www.spottedin.co (apex redirects here)
#   staging site    -> TEST2026.01  -> www.staging.spottedin.co
#
# Branch-to-environment mapping lives here rather than in GitHub because a
# GitHub Pages site is one-per-repository and cannot serve two environments.
#
# Netlify is also a rewrite-capable host, which docs/launch/STAGING_ROUTING.md
# records as a prerequisite for moving off HashRouter: dynamic routes such as
# /listing/<id>/<slug> must return the app shell with HTTP 200, and GitHub
# Pages can only return 404 for them.
#
# Note on deploy contexts: each site builds its own designated branch, so both
# sites resolve to the `production` context. A `[context.<branch>]` block would
# therefore never fire on the staging site. Anything that must differ between
# the two is set as a site-level environment variable in the Netlify UI, not
# here — see the list at the bottom of this file.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serve the SPA shell for any path instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Non-production branches and pull-request previews on either site. These get a
# generated URL that cannot be known ahead of time, so VITE_SITE_ORIGIN is left
# unset and falls back to production: sign-in from a preview redirects to
# production. Previews are for reviewing UI, not the auth round-trip.

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Per-site environment variables, set in the Netlify UI
# (Site configuration -> Environment variables):
#
#   production site
#     VITE_SITE_ORIGIN        https://www.spottedin.co   (or leave unset)
#     VITE_SUPABASE_URL       live project
#     VITE_SUPABASE_ANON_KEY  live project
#
#   staging site
#     VITE_SITE_ORIGIN        https://www.staging.spottedin.co
#     VITE_NOINDEX            true
#     VITE_SUPABASE_URL       staging project
#     VITE_SUPABASE_ANON_KEY  staging project
#
# VITE_NOINDEX forces the robots meta tag to noindex (src/lib/seo.ts). It is
# required on staging because a context-scoped header cannot reach a site whose
# own branch builds as `production`.
#
# VITE_SUPABASE_* are required on staging. src/lib/supabase.ts falls back to the
# live project when unset, so an unconfigured staging site writes to production
# data and its real user accounts.
