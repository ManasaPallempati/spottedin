<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spotted</title>
  <script>
    // GH Pages SPA fallback: preserves query + hash so HashRouter sees the path.
    var q = window.location.search;
    var h = window.location.hash;
    window.location.replace('/' + q + h);
  </script>
</head>
<body>
  <noscript><a href="/">Spotted — Buy & Sell Pre-Owned Indian Fashion</a></noscript>
</body>
</html>
