name: CI

on:
  pull_request:
    branches: ['main', 'TEST2026.02']

jobs:
  # Job id is `test` because that is the status check required by branch
  # protection on main and TEST2026.02. The gate is a clean type-check +
  # production build (`npm run build` runs tsc -b), then the smoke tests
  # (`npm test`: Vitest + Testing Library against an in-memory Supabase fake,
  # so CI needs no database or secrets).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Smoke tests
        run: npm test
