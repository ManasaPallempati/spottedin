name: CI

on:
  pull_request:
    branches: ['main', 'TEST2026.01']

jobs:
  # Job id is `test` because that is the status check required by branch
  # protection on main and TEST2026.01. This app ships no unit tests yet, so
  # the gate is a clean type-check + production build (`npm run build` runs
  # tsc -b).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
